name: Opstellingen finaliseren (definitief ~1u voor aftrap)

on:
  schedule:
    # Elke 10 min tussen 07:00-21:00 UTC (= 09:00-23:00 CEST) — dekt alle
    # aftrapmomenten ruim. Flipt alleen wedstrijden waarvan de opstelling binnen is.
    # (Publieke repo = onbeperkte Actions-minuten.)
    - cron: "*/10 7-21 * * *"
  workflow_dispatch:

jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pillow (deelafbeeldingen)
        run: pip install -q pillow
      - name: Flip naar definitieve opstellingen
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
        run: python3 finalize.py
      - name: State terugcommitten
        run: |
          git config user.name "opstellingen-bot"
          git config user.email "bot@bet-experts.nl"
          git add state/opstellingen.json og/*.webp || true
          git commit -m "state: definitief geflipt [skip ci]" || echo "geen wijziging"
          git pull --rebase -X theirs origin main || git rebase --abort
          git push || true
      - name: Deelafbeeldingen koppelen (na push, raw-URL moet bestaan)
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
        run: |
          python3 attach_og.py
          git add state/opstellingen.json || true
          git commit -m "state: deelafbeeldingen gekoppeld [skip ci]" || echo "geen wijziging"
          git pull --rebase -X theirs origin main || git rebase --abort
          git push || true
